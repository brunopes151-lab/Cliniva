services:
  - type: web
    name: minha-clinica-backend
    runtime: docker
    rootDir: backend
    branch: main
    plan: free
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=50
      # Domínio exato do seu frontend (ex.: https://minha-clinica.vercel.app).
      # Nunca um curinga como https://*.vercel.app: qualquer site na Vercel
      # poderia chamar a API com o token de quem estiver logado.
      - key: CLINIVA_CORS_ORIGIN
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USER
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false