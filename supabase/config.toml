# Cliniva — Supabase CLI config
# Docs: https://supabase.com/docs/guides/cli/config

# Referência local: o projeto é linkado ao remoto via `supabase link`
# (gera supabase/.temp/project-ref com o project ref real — não versionar).
project_id = "minha-clinica"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
# Inclua aqui o domínio de produção do SEU frontend antes do deploy.
additional_redirect_urls = []
jwt_expiry = 3600
# Auto-cadastro fechado: dados de saúde. Os usuários são criados pelo
# administrador (painel /admin), que usa a service role do Supabase.
enable_signup = false