spring.application.name=cliniva
# porta do container: Render injeta PORT; local cai no 8080
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cliniva}
spring.datasource.username=${SPRING_DATASOURCE_USER:cliniva}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cliniva}

# schema gerenciado pelas migrations do Supabase (supabase/migrations/).
# O Hibernate em validate apenas confere se as colunas existem.
spring.jpa.hibernate.ddl-auto=validate

# segurança: Supabase Auth (JWKS) e origens permitidas no CORS
cliniva.supabase.url=${SUPABASE_URL:}
cliniva.supabase.jwt-secret=${SUPABASE_JWT_SECRET:}
cliniva.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
cliniva.cors-origin=${CLINIVA_CORS_ORIGIN:http://localhost:5173}

# commit do build, injetado pelo Render via RENDER_GIT_COMMIT e exposto em
# /api/saude/build. Serve para detectar deploy falho: se o health check
# responder 200 mas o commit divergir da main, o container é o antigo.
cliniva.build.commit=${RENDER_GIT_COMMIT:desconhecido}

# Resumo do dia com IA.
#
# LLM_PROVIDER vazio = nenhuma chamada externa, cai no template. Só defina
# depois de ter a chave correspondente.
#
# Os defaults de modelo foram conferidos contra a lista oficial em
# 2026-09-30. O `groq/compound-mini` que estava aqui não existe na Groq —
# com ele, TODA chamada falhava e o produto caía no template sem perceber.
# A lista da Groq: https://console.groq.com/docs/models
# A lista da Gemini: https://ai.google.dev/gemini-api/docs/models
#
# gemini-3.6-flash é válido, mas é "previous-generation". Para um resumo
# curto e barato, 3.5-flash-lite é a escolha certa; use 3.8-flash se
# quiser mais qualidade.
cliniva.llm.provider=${LLM_PROVIDER:}
cliniva.llm.gemini.api-key=${LLM_GEMINI_API_KEY:}
cliniva.llm.gemini.model=${LLM_GEMINI_MODEL:gemini-3.5-flash-lite}
cliniva.llm.groq.api-key=${LLM_GROQ_API_KEY:}
cliniva.llm.groq.model=${LLM_GROQ_MODEL:llama-3.1-8b-instant}